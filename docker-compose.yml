# Umami Ramen — single service, built from the Dockerfile in this directory.
#
#   docker compose up --build      # http://localhost:3000
#
# Every variable below is optional. With no .env and nothing exported, the site
# builds and serves exactly as it does for a fresh clone: feature flags
# on their declared defaults, zero outbound requests.
#
# NEXT_PUBLIC_* is inlined into the client bundle by `next build`, so it is
# passed twice on purpose: as a build arg (bakes it into the browser bundle)
# and as runtime env (available to the server). Change a key and you need
# `--build` for it to reach the browser.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_FLAG_OVERRIDES: ${NEXT_PUBLIC_FLAG_OVERRIDES:-}
    image: umami-ramen:latest
    container_name: umami-ramen
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_FLAG_OVERRIDES: ${NEXT_PUBLIC_FLAG_OVERRIDES:-}
    # Picked up when present; a repo with no .env starts all the same.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    # HEALTHCHECK is defined in the Dockerfile; only the grace period is
    # stretched here to cover a cold first paint on a loaded host.
    healthcheck:
      start_period: 20s
