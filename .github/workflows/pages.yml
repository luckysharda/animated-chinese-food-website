name: Deploy to Cloudflare Pages

# Publishes the static export to Cloudflare Pages on every push to main.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   an API token with the "Cloudflare Pages — Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  from the right-hand sidebar of any Cloudflare dashboard page
#
# Without them the job fails fast with a clear message rather than half-deploying.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22, not 20: wrangler requires >=22, and Next 15 is happy on either.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check credentials are configured
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — see DEPLOY.md"
            exit 1
          fi
          echo "Both Cloudflare secrets are present."

      - run: npm ci

      # BUILD_TARGET=static switches next.config.ts from `standalone` to `export`,
      # which is what produces out/. The Docker image still uses the default target.
      - name: Build static export
        run: npm run build:static

      - name: Report deployment size
        run: |
          echo "files: $(find out -type f | wc -l)  (Cloudflare Pages allows 20,000)"
          echo "size:  $(du -sh out | cut -f1)"
          big=$(find out -type f -size +25M | head -5)
          if [ -n "$big" ]; then
            echo "::error::Files above the 25MB per-file limit:"; echo "$big"; exit 1
          fi

      # `wrangler pages deploy` cannot create a project non-interactively: if the
      # project does not exist yet it tries to prompt, and the job dies with a
      # confusing error. Creating it first is idempotent — the second and every
      # later run just reports that it already exists.
      - name: Ensure the Pages project exists
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create umami-ramen --production-branch=main

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy --branch=main
