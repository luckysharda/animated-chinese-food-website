name: Release

# Publishes the container image to GitHub Container Registry.
#
#   push to main   -> waits for CI on the same commit, then pushes  :main  :latest  :sha-<short>
#   push tag v*    -> pushes  :1.4.2  :1.4  :1  :sha-<short>        (no CI gate; tags are cut
#                     from a commit main already proved)
#
# No build-time configuration is required; feature flags ship at their defaults.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Filename of the CI workflow this release waits on. If it does not exist in the repo the
  # gate logs a warning and lets the release through rather than wedging main.
  CI_WORKFLOW: ci.yml
  # How long to wait for a CI run to be *created* before deciding this push has no CI run.
  CI_GATE_GRACE_SECONDS: "150"
  # How long to wait for a CI run that exists to finish.
  CI_GATE_TIMEOUT_SECONDS: "1800"

jobs:
  # ---------------------------------------------------------------------------------------
  # 1. Don't publish an image built from a commit CI has not blessed.
  # ---------------------------------------------------------------------------------------
  ci-gate:
    name: Wait for CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Tag push — CI gate does not apply
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "Releasing tag ${GITHUB_REF_NAME}; its commit was gated when it landed on main."

      - name: Require a green CI run for this commit
        if: startsWith(github.ref, 'refs/heads/')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if ! gh api "repos/${REPO}/actions/workflows/${CI_WORKFLOW}" >/dev/null 2>&1; then
            echo "::warning title=CI gate skipped::.github/workflows/${CI_WORKFLOW} does not exist in ${REPO}. Publishing without a CI gate — set CI_WORKFLOW in release.yml to the real filename."
            exit 0
          fi

          echo "Waiting on ${CI_WORKFLOW} for ${SHA}"
          start=$SECONDS

          while :; do
            elapsed=$(( SECONDS - start ))
            run=$(gh api "repos/${REPO}/actions/workflows/${CI_WORKFLOW}/runs?head_sha=${SHA}&per_page=1" \
                    --jq '.workflow_runs[0] // empty' 2>/dev/null || true)

            if [ -z "$run" ]; then
              if [ "$elapsed" -ge "$CI_GATE_GRACE_SECONDS" ]; then
                echo "::warning title=CI gate skipped::no ${CI_WORKFLOW} run for ${SHA} after ${CI_GATE_GRACE_SECONDS}s (path filters? branch filters?). Publishing anyway."
                exit 0
              fi
              echo "  no run yet (${elapsed}s)"
              sleep 10
              continue
            fi

            status=$(printf '%s' "$run" | jq -r '.status')
            conclusion=$(printf '%s' "$run" | jq -r '.conclusion // ""')
            url=$(printf '%s' "$run" | jq -r '.html_url')

            if [ "$status" != "completed" ]; then
              if [ "$elapsed" -ge "$CI_GATE_TIMEOUT_SECONDS" ]; then
                echo "::error title=CI gate timed out::${url} is still '${status}' after ${CI_GATE_TIMEOUT_SECONDS}s."
                exit 1
              fi
              echo "  ${status} (${elapsed}s) ${url}"
              sleep 15
              continue
            fi

            case "$conclusion" in
              success|skipped)
                echo "CI ${conclusion} — ${url}"
                exit 0
                ;;
              *)
                echo "::error title=CI is not green::${CI_WORKFLOW} concluded '${conclusion}' for ${SHA} — ${url}"
                exit 1
                ;;
            esac
          done

  # ---------------------------------------------------------------------------------------
  # 2. Build once, push to ghcr.io/<owner>/<repo>.
  # ---------------------------------------------------------------------------------------
  image:
    name: Build and push image
    needs: ci-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR rejects uppercase path segments; github.repository preserves the owner's casing.
      - name: Resolve image name
        id: name
        run: |
          set -euo pipefail
          echo "image=${REGISTRY}/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          # latest=false: we want :latest to track main, not the newest tag, which is what
          # the default (latest=auto) would give us.
          flavor: |
            latest=false
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=UMAMI // 拉麵
            org.opencontainers.image.description=Scroll-choreographed single-page site for a fictional Yokohama ramen shop.

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Single-platform push: attestations would add an extra "unknown/unknown" entry to
          # the package listing for no benefit here. See DEPLOY.md to turn them back on.
          provenance: false
          # NEXT_PUBLIC_* is inlined by `next build` — it MUST arrive as a build arg. Passing
          # it at `docker run` time does nothing. See DEPLOY.md, "Read this first".
          # Unset secret/variable => empty string => the app degrades to inert defaults.
          build-args: |
            NEXT_PUBLIC_FLAG_OVERRIDES=${{ vars.NEXT_PUBLIC_FLAG_OVERRIDES }}

      - name: Summary
        if: always() && steps.build.outcome == 'success'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "### Pushed \`linux/amd64\`"
            echo
            echo '```'
            printf '%s\n' "$TAGS"
            echo '```'
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "| baked-in at build | value |"
            echo "| --- | --- |"
            echo
            echo "Changing either of those requires a **rebuild**, not a restart."
          } >> "$GITHUB_STEP_SUMMARY"
